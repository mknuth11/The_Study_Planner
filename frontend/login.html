<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">📚 Study Planner</div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="add-task.html">Add Task</a></li>
            <li><a href="completed.html">Completed</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="form-container">

            <div class="form-header">
                <h2>Welcome Back! 👋</h2>
                <p class="form-subtitle">Login to access your Study Planner dashboard.</p>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="error-message" style="display:none;"></div>

            <!-- Success Message -->
            <div class="success-message" id="success-message" style="display:none;"></div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
                <span class="field-error" id="username-error"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
                <span class="field-error" id="password-error"></span>
            </div>

            <button class="btn-primary" id="login-btn" onclick="handleLogin()">Login</button>

            <p class="form-footer">Don't have an account? <a href="signup.html">Sign up here</a></p>

        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
