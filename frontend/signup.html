<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Study Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">📚 Study Planner</div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="add-task.html">Add Task</a></li>
            <li><a href="completed.html">Completed</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="form-container">
            <h2>Create Account</h2>
            <p class="form-subtitle">Join Study Planner and start organizing your tasks!</p>

            <!-- Error Message -->
            <div class="error-message" id="error-message" style="display:none;">
                ⚠️ <span id="error-text"></span>
            </div>

            <!-- Success Message -->
            <div class="success-message" id="success-message" style="display:none;">
                ✅ Account created successfully! <a href="login.html">Login here</a>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
                <span class="field-error" id="username-error"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <span class="field-error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
                <span class="field-error" id="password-error"></span>
            </div>

            <button class="btn-primary" id="signup-btn" onclick="handleSignup()">Create Account</button>
            <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>

   <script src="js/session.js"></script>
   <script src="js/auth.js"></script>
<script>
    updateNavbar();
</script>
</body>
</html>
