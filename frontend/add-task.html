<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - Study Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">📚 Study Planner</div>
        <ul class="nav-links"></ul>
    </nav>

    <main class="main-content">
        <div class="form-container">

            <div class="form-header">
                <h2>Add New Task 📝</h2>
                <p class="form-subtitle">Fill in the details below to add a new task to your planner.</p>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="error-message" style="display:none;"></div>

            <!-- Success Message -->
            <div class="success-message" id="success-message" style="display:none;"></div>

            <div class="form-group">
                <label for="course-name">Course Name</label>
                <input type="text" id="course-name" placeholder="e.g. Biology 101">
                <span class="field-error" id="course-name-error"></span>
            </div>

            <div class="form-group">
                <label for="task-name">Task Name</label>
                <input type="text" id="task-name" placeholder="e.g. Chapter 4 Lab Report">
                <span class="field-error" id="task-name-error"></span>
            </div>

            <div class="form-group">
                <label for="task-type">Task Type</label>
                <select id="task-type">
                    <option value="">-- Select Type --</option>
                    <option value="Homework">Homework</option>
                    <option value="Quiz">Quiz</option>
                    <option value="Test">Test</option>
                    <option value="Project">Project</option>
                </select>
                <span class="field-error" id="task-type-error"></span>
            </div>

            <div class="form-group">
                <label for="deadline">Deadline</label>
                <input type="datetime-local" id="deadline">
                <span class="field-error" id="deadline-error"></span>
            </div>

            <div class="form-group">
                <label for="estimated-time">Estimated Time (hours)</label>
                <input type="number" id="estimated-time" placeholder="e.g. 2.5" min="0.5" step="0.5">
                <span class="field-error" id="estimated-time-error"></span>
            </div>

            <div class="form-group">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" placeholder="Any extra details about this task..."></textarea>
            </div>

            <button class="btn-primary" id="add-task-btn" onclick="handleAddTask()">Add Task</button>

            <p class="form-footer"><a href="index.html">← Back to Dashboard</a></p>

        </div>
    </main>

    <script src="js/session.js"></script>
    <script src="js/tasks.js"></script>
    <script>
        requireLogin();
        updateNavbar();
    </script>
</body>
</html>
